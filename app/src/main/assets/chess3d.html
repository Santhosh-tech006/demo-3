<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Grandmaster 3D Chessboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #071426;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .hud {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-btn {
      pointer-events: auto;
      background: rgba(16, 41, 74, 0.85);
      border: 1px solid #38BDF8;
      color: #F8FAFC;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-radius: 20px;
      box-shadow: 0 4px 12px rgba(7, 20, 38, 0.6);
      backdrop-filter: blur(8px);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .hud-btn:active {
      transform: scale(0.95);
      background: #2563EB;
    }
    .hud-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(11, 31, 58, 0.75);
      border: 1px solid #244466;
      color: #93C5FD;
      font-size: 10px;
      padding: 4px 10px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="hud-badge">♟ 3D REAL-TIME CHESS ENGINE</div>
  <div class="hud">
    <button class="hud-btn" id="btn-move">▶ Next Legal Move</button>
    <button class="hud-btn" id="btn-cam">↺ Orbit Cam</button>
    <button class="hud-btn" id="btn-reset">⟲ Reset</button>
  </div>

  <script>
    // Initialize Three.js scene
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x071426);
    scene.fog = new THREE.FogExp2(0x071426, 0.035);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 14, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Lights: Blue rim, warm key, ambient fill
    const ambientLight = new THREE.AmbientLight(0x1e293b, 1.4);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
    keyLight.position.set(10, 25, 15);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    scene.add(keyLight);

    const blueRimLight = new THREE.PointLight(0x38bdf8, 3.5, 35);
    blueRimLight.position.set(-8, 6, -8);
    scene.add(blueRimLight);

    const royalRimLight = new THREE.PointLight(0x2563eb, 3.0, 35);
    royalRimLight.position.set(8, 6, 8);
    scene.add(royalRimLight);

    // Subtle atmospheric dust particles
    const particleCount = 70;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      particlePositions[i] = (Math.random() - 0.5) * 30;
      particlePositions[i + 1] = Math.random() * 15;
      particlePositions[i + 2] = (Math.random() - 0.5) * 30;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0x38bdf8,
      size: 0.15,
      transparent: true,
      opacity: 0.6
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // Chessboard Group
    const boardGroup = new THREE.Group();
    scene.add(boardGroup);

    // Board Base Pedestal
    const baseGeo = new THREE.BoxGeometry(10.4, 0.6, 10.4);
    const baseMat = new THREE.MeshStandardMaterial({
      color: 0x0b1f3a,
      roughness: 0.25,
      metalness: 0.7
    });
    const baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.y = -0.3;
    baseMesh.receiveShadow = true;
    boardGroup.add(baseMesh);

    // Board Border Rim
    const rimGeo = new THREE.BoxGeometry(9.8, 0.2, 9.8);
    const rimMat = new THREE.MeshStandardMaterial({
      color: 0x244466,
      roughness: 0.1,
      metalness: 0.9
    });
    const rimMesh = new THREE.Mesh(rimGeo, rimMat);
    rimMesh.position.y = 0.05;
    boardGroup.add(rimMesh);

    // 8x8 Tiles
    const tileSize = 1.1;
    const tileGeo = new THREE.BoxGeometry(tileSize * 0.96, 0.15, tileSize * 0.96);
    const whiteTileMat = new THREE.MeshStandardMaterial({
      color: 0x16345c,
      roughness: 0.15,
      metalness: 0.4
    });
    const darkTileMat = new THREE.MeshStandardMaterial({
      color: 0x071426,
      roughness: 0.35,
      metalness: 0.8
    });

    const tiles = [];
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const isWhite = (r + c) % 2 === 0;
        const tile = new THREE.Mesh(tileGeo, isWhite ? whiteTileMat : darkTileMat);
        const x = (c - 3.5) * tileSize;
        const z = (r - 3.5) * tileSize;
        tile.position.set(x, 0.1, z);
        tile.receiveShadow = true;
        boardGroup.add(tile);
        tiles.push({ mesh: tile, r, c });
      }
    }

    // Procedural 3D Chess Pieces Materials
    const whitePieceMat = new THREE.MeshStandardMaterial({
      color: 0xf8fafc,
      roughness: 0.1,
      metalness: 0.25
    });
    const blackPieceMat = new THREE.MeshStandardMaterial({
      color: 0x10294a,
      roughness: 0.2,
      metalness: 0.8
    });
    const glowingBlueMat = new THREE.MeshStandardMaterial({
      color: 0x38bdf8,
      emissive: 0x2563eb,
      emissiveIntensity: 0.6,
      roughness: 0.1,
      metalness: 0.5
    });

    // Helper functions to build piece geometries
    function createPawn(mat) {
      const g = new THREE.Group();
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.38, 0.15, 16), mat);
      base.position.y = 0.075;
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 0.5, 16), mat);
      body.position.y = 0.35;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), mat);
      head.position.y = 0.72;
      g.add(base, body, head);
      g.traverse(obj => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
      return g;
    }

    function createKnight(mat) {
      const g = new THREE.Group();
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.42, 0.18, 16), mat);
      base.position.y = 0.09;
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.32, 0.6, 16), mat);
      body.position.set(0, 0.45, 0);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.45, 0.55), mat);
      head.position.set(0, 0.85, 0.1);
      head.rotation.x = 0.3;
      const snout = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.3, 12), mat);
      snout.position.set(0, 0.75, 0.38);
      snout.rotation.x = -1.2;
      g.add(base, body, head, snout);
      g.traverse(obj => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
      return g;
    }

    function createBishop(mat) {
      const g = new THREE.Group();
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.42, 0.18, 16), mat);
      base.position.y = 0.09;
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 0.7, 16), mat);
      body.position.y = 0.48;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 16), mat);
      head.position.y = 0.95;
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), mat);
      tip.position.y = 1.22;
      g.add(base, body, head, tip);
      g.traverse(obj => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
      return g;
    }

    function createRook(mat) {
      const g = new THREE.Group();
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.44, 0.18, 16), mat);
      base.position.y = 0.09;
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 0.65, 16), mat);
      body.position.y = 0.46;
      const top = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.3, 0.28, 16), mat);
      top.position.y = 0.86;
      g.add(base, body, top);
      g.traverse(obj => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
      return g;
    }

    function createQueen(mat) {
      const g = new THREE.Group();
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.46, 0.2, 16), mat);
      base.position.y = 0.1;
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.34, 0.85, 16), mat);
      body.position.y = 0.58;
      const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.24, 0.35, 16), mat);
      crown.position.y = 1.08;
      const jewel = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), glowingBlueMat);
      jewel.position.y = 1.3;
      g.add(base, body, crown, jewel);
      g.traverse(obj => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
      return g;
    }

    function createKing(mat) {
      const g = new THREE.Group();
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.48, 0.2, 16), mat);
      base.position.y = 0.1;
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.36, 0.95, 16), mat);
      body.position.y = 0.62;
      const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.26, 0.4, 16), mat);
      crown.position.y = 1.18;
      // Cross
      const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.08), glowingBlueMat);
      crossV.position.y = 1.48;
      const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.08, 0.08), glowingBlueMat);
      crossH.position.y = 1.5;
      g.add(base, body, crown, crossV, crossH);
      g.traverse(obj => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
      return g;
    }

    // Map pieces on board
    const pieces = [];
    function placePiece(creator, mat, r, c, id) {
      const p = creator(mat);
      const x = (c - 3.5) * tileSize;
      const z = (r - 3.5) * tileSize;
      p.position.set(x, 0.15, z);
      boardGroup.add(p);
      pieces.push({ obj: p, r, c, id, creator, mat, initR: r, initC: c });
      return p;
    }

    // Set up standard starting pieces
    function setupBoard() {
      // Clear previous
      pieces.forEach(p => boardGroup.remove(p.obj));
      pieces.length = 0;

      // Pawns
      for (let c = 0; c < 8; c++) {
        placePiece(createPawn, whitePieceMat, 1, c, 'wp' + c);
        placePiece(createPawn, blackPieceMat, 6, c, 'bp' + c);
      }
      // White pieces
      placePiece(createRook, whitePieceMat, 0, 0, 'wr1');
      placePiece(createKnight, whitePieceMat, 0, 1, 'wn1');
      placePiece(createBishop, whitePieceMat, 0, 2, 'wb1');
      placePiece(createQueen, whitePieceMat, 0, 3, 'wq');
      placePiece(createKing, whitePieceMat, 0, 4, 'wk');
      placePiece(createBishop, whitePieceMat, 0, 5, 'wb2');
      placePiece(createKnight, whitePieceMat, 0, 6, 'wn2');
      placePiece(createRook, whitePieceMat, 0, 7, 'wr2');

      // Black pieces
      placePiece(createRook, blackPieceMat, 7, 0, 'br1');
      placePiece(createKnight, blackPieceMat, 7, 1, 'bn1');
      placePiece(createBishop, blackPieceMat, 7, 2, 'bb1');
      placePiece(createQueen, blackPieceMat, 7, 3, 'bq');
      placePiece(createKing, blackPieceMat, 7, 4, 'bk');
      placePiece(createBishop, blackPieceMat, 7, 5, 'bb2');
      placePiece(createKnight, blackPieceMat, 7, 6, 'bn2');
      placePiece(createRook, blackPieceMat, 7, 7, 'br2');
    }

    setupBoard();

    // Legal move sequence demonstration (Italian Game opening: 1. e4 e5, 2. Nf3 Nc6, 3. Bc4)
    const moveSequence = [
      { id: 'wp4', targetR: 3, targetC: 4, desc: '1. e4' },
      { id: 'bp4', targetR: 4, targetC: 4, desc: '1... e5' },
      { id: 'wn2', targetR: 2, targetC: 5, desc: '2. Nf3' },
      { id: 'bn1', targetR: 5, targetC: 2, desc: '2... Nc6' },
      { id: 'wb2', targetR: 3, targetC: 2, desc: '3. Bc4' }
    ];

    let currentMoveIndex = 0;
    let isMoving = false;

    function animatePieceMove(pieceItem, toR, toC, onComplete) {
      isMoving = true;
      const startX = pieceItem.obj.position.x;
      const startZ = pieceItem.obj.position.z;
      const targetX = (toC - 3.5) * tileSize;
      const targetZ = (toR - 3.5) * tileSize;

      const duration = 700; // ms
      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        // Smooth easing
        const ease = 0.5 - Math.cos(progress * Math.PI) / 2;

        pieceItem.obj.position.x = startX + (targetX - startX) * ease;
        pieceItem.obj.position.z = startZ + (targetZ - startZ) * ease;
        // Parabolic arc jump
        pieceItem.obj.position.y = 0.15 + Math.sin(progress * Math.PI) * 1.4;

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          pieceItem.obj.position.y = 0.15;
          pieceItem.r = toR;
          pieceItem.c = toC;
          isMoving = false;
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(step);
    }

    function playNextMove() {
      if (isMoving) return;
      if (currentMoveIndex >= moveSequence.length) {
        // Reset sequence
        setupBoard();
        currentMoveIndex = 0;
        return;
      }
      const step = moveSequence[currentMoveIndex];
      const piece = pieces.find(p => p.id === step.id);
      if (piece) {
        animatePieceMove(piece, step.targetR, step.targetC, () => {
          currentMoveIndex++;
        });
      }
    }

    // Touch & Mouse Orbit controls
    let isDragging = false;
    let prevMouseX = 0;
    let prevMouseY = 0;
    let targetRotationY = -0.3;
    let targetRotationX = 0.2;
    let autoRotate = true;

    window.addEventListener('pointerdown', (e) => {
      isDragging = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
      autoRotate = false;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - prevMouseX;
      const deltaY = e.clientY - prevMouseY;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;

      targetRotationY += deltaX * 0.008;
      targetRotationX = Math.max(-0.2, Math.min(0.6, targetRotationX + deltaY * 0.005));
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    // Button interactions
    document.getElementById('btn-move').addEventListener('click', (e) => {
      e.stopPropagation();
      playNextMove();
    });

    document.getElementById('btn-cam').addEventListener('click', (e) => {
      e.stopPropagation();
      autoRotate = !autoRotate;
    });

    document.getElementById('btn-reset').addEventListener('click', (e) => {
      e.stopPropagation();
      setupBoard();
      currentMoveIndex = 0;
      targetRotationY = -0.3;
      targetRotationX = 0.2;
    });

    // Responsive resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render loop
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Atmospheric rotation & breathing
      if (autoRotate) {
        targetRotationY += 0.003;
      }
      boardGroup.rotation.y += (targetRotationY - boardGroup.rotation.y) * 0.05;
      boardGroup.rotation.x += (targetRotationX - boardGroup.rotation.x) * 0.05;

      // Gentle floating float of chessboard
      boardGroup.position.y = Math.sin(time * 0.8) * 0.15;

      // Floating dust particles
      const positions = particles.geometry.attributes.position.array;
      for (let i = 1; i < positions.length; i += 3) {
        positions[i] += Math.sin(time + i) * 0.002;
      }
      particles.geometry.attributes.position.needsUpdate = true;

      // Subtle dynamic rim light motion
      blueRimLight.position.x = Math.sin(time * 0.5) * 10;
      blueRimLight.position.z = Math.cos(time * 0.5) * 10;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
